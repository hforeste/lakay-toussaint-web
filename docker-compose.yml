services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lakay_toussaint
      POSTGRES_USER: lakay
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakay -d lakay_toussaint"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lakay_postgres_data:/var/lib/postgresql/data

volumes:
  lakay_postgres_data:
